<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Submission Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Assignment Submission Portal</h1>
    <div id="messages" aria-live="polite"></div>

    <form id="submission-form" novalidate>
      <label>Name
        <input name="name" type="text" autocomplete="name">
      </label>
      <label>Registration number
        <input name="regNo" type="text" placeholder="FA23-BSE-009">
      </label>
      <label>Assignment title
        <input name="title" type="text">
      </label>
      <label>Submission URL
        <input name="url" type="text" placeholder="https://github.com/user/repo">
      </label>
      <button type="submit">Submit</button>
    </form>

    <h2>Saved submissions</h2>
    <div class="table-wrap">
      <table id="submissions">
        <thead>
          <tr><th>Name</th><th>Reg. No</th><th>Title</th><th>URL</th><th>Submitted (UTC)</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script src="portal.js"></script>
  <script src="app.js"></script>
</body>
</html>
