name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    # Self-hosted runner on my own laptop, so "localhost" is my computer.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # A failing test makes this step (and therefore the job) fail.
      - name: Run tests
        run: npm run test:ci

      # always(): runs after a failure too, so failing runs are also reported.
      - name: Send report to local receiver
        if: always()
        env:
          RECEIVER_URL: http://localhost:5000/report
        run: node scripts/build-report.js results.xml

      # BONUS 2: email the report after passing AND failing runs.
      # Credentials are repository secrets; if they are not set the step is skipped.
      - name: Email report
        if: always()
        env:
          SMTP_USER: ${{ secrets.MAIL_USERNAME }}
          SMTP_PASS: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: node scripts/send-email.js report-to-send.json

  deploy-pages:               # BONUS 1: runs only when 'test' succeeded
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
